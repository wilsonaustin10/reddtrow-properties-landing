<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell Your House Fast for Cash - Get Offer in 7 Minutes</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <!-- Meta Tags -->
    <meta name="description" content="Get a fair cash offer for your house in 7 minutes or less. We buy houses in any condition - no repairs, no fees, no hassles. Close in as little as 7 days." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sell Your House Fast for Cash - Get Offer in 7 Minutes" />
    <meta property="og:description" content="Get a fair cash offer for your house in 7 minutes or less. No repairs, no fees, no hassles." />

    <!-- Critical CSS - Minimal for fastest FCP -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#1a1a1a}
      @media(max-width:767px){body{padding-bottom:56px}}
      .sk-wrap{min-height:100vh;background:#fff}
      .sk-hdr{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 1rem}
      .sk-hero{min-height:550px;background:linear-gradient(135deg,#8B2828,#a33232);display:flex;align-items:center;padding:2rem 1rem}
      .sk-form{background:#fff;border-radius:12px;padding:1.5rem;max-width:28rem;margin:0 auto;border:2px solid #8B2828;min-height:480px}
      .sk-bar{position:fixed;bottom:0;left:0;right:0;height:56px;background:#4F4F4F;display:none}
      @media(max-width:767px){.sk-bar{display:flex;align-items:center;justify-content:center}}
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Minimal skeleton for instant FCP -->
      <div class="sk-wrap">
        <div class="sk-hdr">
          <div style="width:127px;height:56px;background:#f3f4f6;border-radius:8px"></div>
          <div style="width:120px;height:40px;background:#4F4F4F;border-radius:8px"></div>
        </div>
        <div class="sk-hero">
          <div class="sk-form">
            <div style="height:28px;background:#8B2828;border-radius:4px;margin-bottom:8px;width:70%"></div>
            <div style="height:16px;background:#f3f4f6;border-radius:4px;margin-bottom:24px;width:50%"></div>
            <div style="height:48px;background:#f9fafb;border-radius:8px;margin-bottom:16px;border:1px solid #e5e7eb"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
              <div style="height:48px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb"></div>
              <div style="height:48px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb"></div>
            </div>
            <div style="height:48px;background:#f9fafb;border-radius:8px;margin-bottom:16px;border:1px solid #e5e7eb"></div>
            <div style="height:48px;background:#f9fafb;border-radius:8px;margin-bottom:16px;border:1px solid #e5e7eb"></div>
            <div style="height:56px;background:#4F4F4F;border-radius:8px;margin-top:16px"></div>
          </div>
        </div>
      </div>
      <div class="sk-bar"></div>
    </div>

    <!-- Main app - defer loading -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Attribution script - runs after paint -->
    <script>
      requestIdleCallback?requestIdleCallback(function(){
        var p=new URLSearchParams(location.search),s=sessionStorage,c=document.cookie;
        var d={gclid:p.get('gclid')||'',wbraid:p.get('wbraid')||'',gbraid:p.get('gbraid')||'',
          utm_source:p.get('utm_source')||'google',utm_medium:p.get('utm_medium')||'cpc',
          utm_campaign:p.get('utm_campaign')||'',landing_page:location.pathname,
          referrer:document.referrer||'',session_id:crypto.randomUUID?.()??Date.now()+'-'+Math.random().toString(36).slice(2)};
        Object.keys(d).forEach(function(k){if(d[k])try{s.setItem(k,d[k])}catch(e){}});
        document.cookie='_aa_lt='+encodeURIComponent(JSON.stringify(d))+';Max-Age=7776000;Path=/;SameSite=Lax';
      }):setTimeout(arguments.callee,100);
    </script>

    <!-- GTM - loads on interaction -->
    <script>
      window.dataLayer=window.dataLayer||[];
      function loadGTM(){if(window.__gtm)return;window.__gtm=1;
        var s=document.createElement('script');s.async=1;
        s.src='https://www.googletagmanager.com/gtm.js?id=GTM-MGDBJPQQ';
        document.head.appendChild(s)}
      ['scroll','click','touchstart'].forEach(function(e){
        document.addEventListener(e,loadGTM,{once:1,passive:1})});
      requestIdleCallback?requestIdleCallback(loadGTM,{timeout:4000}):setTimeout(loadGTM,3000);
    </script>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MGDBJPQQ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  </body>
</html>
